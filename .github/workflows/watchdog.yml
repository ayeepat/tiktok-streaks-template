name: 3. Watchdog (did today's messages send?)

# GitHub's scheduler is best-effort — a run can be silently dropped, and a run
# that never starts produces no failure and therefore no email. This turns that
# silence into a failed run, which GitHub does notify you about.
#
# Costs no Browserbase minutes: it only reads the committed state file.
on:
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Was everyone messaged today?
        run: npm run check-today
        env:
          FRIENDS_JSON: ${{ secrets.FRIENDS_JSON }}
