name: TEMP schedule test (public control)

# Control experiment. The private repo this template came from receives zero
# schedule events despite everything checking out. This is identical, but in a
# PUBLIC repo. If this fires and the private one does not, the difference is
# repo visibility / plan, not configuration. DELETE once answered.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dispatched $(date -u). Trigger '${{ github.event_name }}'."
